# Base settings are safe for production. `dev` adds verbose logging; `prod` hides Swagger.
# Activate with SPRING_PROFILES_ACTIVE=dev (or prod).
spring:
  application:
    name: fleettrack

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    open-in-view: false    # no lazy loading during JSON rendering; services return DTOs
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

fleettrack:
  location-max-age: ${LOCATION_MAX_AGE:15m}
  auto-assign-radius-km: 25
  login-attempts-per-minute: 10
  # Comma-separated browser origins, e.g. https://dispatch.example.com
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

logging:
  level:
    com.fleettrack: INFO
