# Tests run the real Flyway migrations on H2 (MySQL mode) and then let Hibernate *validate*
# the entities against that schema, so a migration that drifts from the entities fails the build.
# MySqlMigrationTest repeats this on a real MySQL 8 container when Docker is available.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

logging:
  level:
    com.fleettrack: WARN
