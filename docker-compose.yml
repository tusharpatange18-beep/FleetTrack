version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: fleettrack-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fleettrack
      MYSQL_USER: fleettrack_user
      MYSQL_PASSWORD: fleettrack_pass
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
