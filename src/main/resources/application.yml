spring:
  application:
    name: fleettrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fleettrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:fleettrack_user}
    password: ${DB_PASSWORD:fleettrack_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

logging:
  level:
    com.fleettrack: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
